name: Build GCC for ARM Android (Docker)

on:
  workflow_dispatch:

jobs:
  build-gcc:
    runs-on: ubuntu-latest

    steps:
      - name: Clone original gcc-for-arm
        run: |
          git clone https://github.com/paulocoutinhox/gcc-for-arm.git
          cd gcc-for-arm
          echo "=== Dockerfile ==="
          cat Dockerfile

      - name: Patch Dockerfile (python → python3, add texinfo)
        run: |
          cd gcc-for-arm
          # Заменяем "python" на "python3" в списке пакетов
          sed -i 's/^\s*python\s*$/    python3 \\/' Dockerfile
          # Добавляем texinfo, если его нет
          if ! grep -q texinfo Dockerfile; then
            sed -i 's/m4$/m4 \\\n    texinfo/' Dockerfile
          fi
          echo "=== Исправленный Dockerfile ==="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: docker_build
        continue-on-error: true
        run: |
          cd gcc-for-arm
          docker build -t gcc-for-arm . 2>&1 | tee /tmp/docker-build.log

      - name: Run build.sh inside Docker
        id: build
        if: steps.docker_build.outcome == 'success'
        continue-on-error: true
        run: |
          cd gcc-for-arm
          docker run --rm \
            -v "$PWD":/gcc-for-arm \
            -w /gcc-for-arm \
            gcc-for-arm \
            bash -c "./build.sh" 2>&1 | tee /tmp/build.log

      - name: Check build result
        run: |
          echo "=== Результат ==="
          if [ "${{ steps.docker_build.outcome }}" != "success" ]; then
            echo "❌ Docker build упал"
            echo "=== Последние 50 строк docker-build.log ==="
            tail -50 /tmp/docker-build.log
          elif [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "❌ Сборка GCC упала"
            echo "=== Последние 50 строк build.log ==="
            tail -50 /tmp/build.log
          else
            echo "✅ Всё собралось успешно"
          fi

      - name: Package toolchain
        if: steps.build.outcome == 'success'
        run: |
          cd gcc-for-arm
          mkdir -p /tmp/gcc-arm-android
          cp -r arm-toolchain /tmp/gcc-arm-android/ 2>/dev/null || echo "arm-toolchain not found"
          cp -r contents /tmp/gcc-arm-android/ 2>/dev/null || echo "contents not found"
          tar -czf /tmp/gcc-arm-android.tar.gz -C /tmp gcc-arm-android
          ls -lh /tmp/gcc-arm-android.tar.gz

      - name: Upload toolchain artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gcc-arm-android-toolchain
          path: /tmp/gcc-arm-android.tar.gz
          retention-days: 30
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/docker-build.log
            /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore
