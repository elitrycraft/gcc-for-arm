name: Build GCC for ARM Android

on:
  workflow_dispatch:

jobs:
  build-gcc:
    runs-on: ubuntu-latest

    steps:
      - name: Clone original gcc-for-arm
        run: |
          git clone https://github.com/paulocoutinhox/gcc-for-arm.git
          cd gcc-for-arm
          ls -la
          cat Dockerfile || echo "No Dockerfile"
          cat build.sh || echo "No build.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd gcc-for-arm
          docker build -t gcc-for-arm . 2>&1 | tee /tmp/docker-build.log

      - name: Run build.sh inside Docker
        id: build
        continue-on-error: true
        run: |
          cd gcc-for-arm
          docker run --rm \
            -v "$PWD":/gcc-for-arm \
            -w /gcc-for-arm \
            gcc-for-arm \
            bash -c "./build.sh" 2>&1 | tee /tmp/build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build.log
            /tmp/docker-build.log
          retention-days: 7
